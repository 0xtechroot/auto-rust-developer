[package]
name = "auto-rust-developer"
version = "0.1.0"
edition = "2021"
authors = ["Manmeet <manietdavv@gmail.com>"]
description = "A modern Rust CLI application with async capabilities"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
